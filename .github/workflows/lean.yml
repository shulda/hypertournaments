name: Lean CI

on:
  push:
    branches: [main, "formalization/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reject placeholders and custom axioms
        shell: bash
        run: |
          if grep -R -nE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' --include='*.lean' Hypertournaments Hypertournaments.lean; then
            echo "Unfinished proof or custom axiom found."
            exit 1
          fi
      - name: Build and audit Lean project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          use-github-cache: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: Hypertournaments
          axiom-audit-allow: propext,Classical.choice,Quot.sound
