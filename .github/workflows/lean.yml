name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          save-always: true
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Install elan (retry transient network errors)
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 4                 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh                 -o /tmp/elan-init.sh &&                sh /tmp/elan-init.sh -y --default-toolchain none; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reject placeholders and custom axioms
        shell: bash
        run: |
          if grep -R -nE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' --include='*.lean' Hypertournaments Hypertournaments.lean; then
            echo "Unfinished proof or custom axiom found."
            exit 1
          fi
      - name: Install pinned Lean with retries
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if elan toolchain install leanprover/lean4:v4.34.1; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "Lean toolchain download failed after five attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Resolve pinned Mathlib dependencies
        run: lake update
      - name: Build and audit Lean project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          use-github-cache: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: Hypertournaments
          axiom-audit-allow: propext,Classical.choice,Quot.sound
